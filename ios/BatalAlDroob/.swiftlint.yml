included:
  - BatalAlDroob
  - BatalAlDroobTests
  - BatalAlDroobUITests

# Batal Al-Droob is a fully bilingual (Arabic + English) app. Almost every user
# facing string is declared as a paired `ar`/`en` literal on a single line, and
# the catalog search relies on large inline Arabic-dialect synonym tables. The
# thresholds below are tuned to that reality instead of forcing line breaks
# inside localized strings and domain data, which hurts readability and risks
# corrupting the Arabic literals. Functional lint rules stay at their defaults.

line_length:
  warning: 300
  error: 400
  ignores_comments: true
  ignores_urls: true
  ignores_interpolated_strings: true

file_length:
  warning: 1500
  error: 1800

type_body_length:
  warning: 950
  error: 1200

function_body_length:
  warning: 200
  error: 260

cyclomatic_complexity:
  warning: 20
  error: 30

large_tuple:
  warning: 3
  error: 4

identifier_name:
  min_length:
    warning: 2
    error: 1

opening_brace:
  ignore_multiline_function_signatures: true
  ignore_multiline_statement_conditions: true
