name: patrol_hub
description: Foundation architecture for an offline-first Nissan Patrol Safari Y60 SGL catalog app.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/hero/
    - assets/generations/
    - assets/catalog/pdfs/
    - assets/catalog/pages/
    - assets/catalog/diagrams/
    - assets/catalog/search/
